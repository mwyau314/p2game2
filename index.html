<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英文串字大挑戰 - 動物篇</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Arial Round MT Bold', 'Comic Sans MS', sans-serif;
        }
        body {
            background-color: #eef9ff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .game-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            padding: 20px;
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            background: #ffeaa7;
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #d63031;
            margin-bottom: 15px;
        }
        .img-container {
            width: 100%;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }
        .img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 10px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 10px;
        }
        input[type="text"] {
            width: 65%;
            padding: 12px;
            font-size: 1.2rem;
            border: 2px solid #74b9ff;
            border-radius: 10px;
            text-align: center;
            outline: none;
        }
        button {
            padding: 12px 20px;
            font-size: 1.1rem;
            background-color: #00b894;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #00896f;
        }

        /* 總結視窗 (Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            /* 依據要求使用相對路徑 happy.png 作為背景 */
            background: url('./happy.png') no-repeat center center;
            background-size: cover;
            width: 90%;
            max-width: 400px;
            height: 380px;
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .modal-title {
            font-size: 1.8rem;
            color: #2d3436;
            background: rgba(255,255,255,0.85);
            padding: 5px 15px;
            border-radius: 10px;
        }
        .modal-score {
            font-size: 1.5rem;
            color: #d63031;
            font-weight: bold;
            background: rgba(255,255,255,0.9);
            padding: 10px 20px;
            border-radius: 15px;
        }

        /* Responsive 手機微調 */
        @media (max-width: 480px) {
            .game-card { padding: 15px; }
            .img-container { height: 180px; }
            input[type="text"] { font-size: 1rem; }
        }
    </style>
</head>
<body>

<div class="game-card">
    <h2>🦁 動物園串字挑戰 🐘</h2>
    <div class="header">
        <div>第 <span id="q-num">1</span> / 10 題</div>
        <div>⏱️ 剩餘時間: <span id="timer">30</span>s</div>
        <div>得分: <span id="score">0</span></div>
    </div>

    <div class="img-container">
        <img id="animal-img" src="" alt="Animal Image">
    </div>

    <div class="input-group">
        <input type="text" id="user-input" placeholder="請輸入英文生字" autocomplete="off">
        <button onclick="submitAnswer()">提交</button>
    </div>
</div>

<div class="modal" id="result-modal">
    <div class="modal-content">
        <div class="modal-title">🎉 遊戲完成！</div>
        <div class="modal-score">你的得分：<span id="final-score">0</span> / 10</div>
        <button onclick="restartGame()">再玩一次 🔄</button>
    </div>
</div>

<audio id="sound-correct" src="./correct.mp3" preload="auto"></audio>
<audio id="sound-wrong" src="./wrong.mp3" preload="auto"></audio>

<script>
    // 指定 10 個題目資料
    const wordList = [
        { word: "hippo", img: "./hippo.png" },
        { word: "panda", img: "./panda.png" },
        { word: "lion", img: "./lion.png" },
        { word: "tiger", img: "./tiger.png" },
        { word: "monkey", img: "./monkey.png" },
        { word: "elephants", img: "./elephants.png" },
        { word: "rabbits", img: "./rabbits.png" },
        { word: "crocodiles", img: "./crocodiles.png" },
        { word: "zebras", img: "./zebras.png" },
        { word: "koalas", img: "./koalas.png" }
    ];

    let currentQ = 0;
    let score = 0;
    let timeLeft = 30;
    let timerInterval = null;

    function startGame() {
        currentQ = 0;
        score = 0;
        document.getElementById('score').innerText = score;
        document.getElementById('result-modal').style.display = 'none';
        loadQuestion();
    }

    function loadQuestion() {
        if (currentQ >= 10) {
            endGame();
            return;
        }
        
        // 更新介面
        document.getElementById('q-num').innerText = currentQ + 1;
        document.getElementById('animal-img').src = wordList[currentQ].img;
        document.getElementById('user-input').value = '';
        document.getElementById('user-input').focus();

        // 重置倒數計時
        clearInterval(timerInterval);
        timeLeft = 30;
        document.getElementById('timer').innerText = timeLeft;

        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                processAnswer(false); // 超時視同答錯
            }
        }, 1000);
    }

    function submitAnswer() {
        const inputVal = document.getElementById('user-input').value.trim().toLowerCase();
        const correctVal = wordList[currentQ].word.toLowerCase();

        if (inputVal === correctVal) {
            processAnswer(true);
        } else {
            processAnswer(false);
        }
    }

    function processAnswer(isCorrect) {
        clearInterval(timerInterval);
        const sndCorrect = document.getElementById('sound-correct');
        const sndWrong = document.getElementById('sound-wrong');

        if (isCorrect) {
            score++;
            document.getElementById('score').innerText = score;
            sndCorrect.currentTime = 0;
            sndCorrect.play().catch(()=>{});
        } else {
            sndWrong.currentTime = 0;
            sndWrong.play().catch(()=>{});
        }

        currentQ++;
        setTimeout(loadQuestion, 800); // 延遲0.8秒進入下一題
    }

    function endGame() {
        document.getElementById('final-score').innerText = score;
        document.getElementById('result-modal').style.display = 'flex';
    }

    function restartGame() {
        startGame();
    }

    // 支援 Enter 鍵提交
    document.getElementById('user-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            submitAnswer();
        }
    });

    // 啟動遊戲
    startGame();
</script>

</body>
</html>
